version: 2

models:
  - name: stg_nsw_fuel_prices
    description: >
      Cleaned NSW fuel prices at station x fuel-type x day grain.
      Source feed is intraday; snapshotted to one price per day (latest wins)
      for consistent daily reporting.
    columns:
      - name: station_code
        tests: [not_null]
      - name: fueltype_code
        tests: [not_null]
      - name: price_date
        tests: [not_null]
      - name: price_per_litre_aud
        tests:
          - not_null
